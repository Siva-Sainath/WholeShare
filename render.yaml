services:
  # Next.js Web App & API Orchestrator
  - type: web
    name: wholeshare-app
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: wholeshare-db
          property: connectionString
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://wholeshare.onrender.com

databases:
  # Managed PostgreSQL Database
  - name: wholeshare-db
    plan: starter
    region: oregon
    postgresMajorVersion: 16
