<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Outer Vault Perimeter Frame -->
  <rect x="40" y="40" width="320" height="320" rx="24" stroke="#1c2029" stroke-width="2"/>
  <rect x="56" y="56" width="288" height="288" rx="16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Radial Dial Scale -->
  <circle cx="200" cy="200" r="120" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="200" cy="200" r="105" stroke="#1c2029" stroke-width="2"/>

  <!-- Precision Caliper Ticks -->
  <path d="M 200 85 L 200 95 M 200 305 L 200 315 M 85 200 L 95 200 M 305 200 L 315 200" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <path d="M 118 118 L 126 126 M 274 274 L 282 282 M 118 282 L 126 274 M 274 118 L 282 126" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 3 Converging Escrow Ingress Lines (Pooled Demand Ingress) -->
  <path d="M 70 120 L 135 160" stroke="#cbd5e1" stroke-width="1.75" stroke-dasharray="3 3"/>
  <circle cx="70" cy="120" r="4" fill="#0e1015" stroke="#cbd5e1" stroke-width="1.5"/>

  <path d="M 70 280 L 135 240" stroke="#cbd5e1" stroke-width="1.75" stroke-dasharray="3 3"/>
  <circle cx="70" cy="280" r="4" fill="#0e1015" stroke="#cbd5e1" stroke-width="1.5"/>

  <path d="M 330 200 L 265 200" stroke="#cbd5e1" stroke-width="1.75" stroke-dasharray="3 3"/>
  <circle cx="330" cy="200" r="4" fill="#0e1015" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Heavy Escrow Vault Door Geometry -->
  <circle cx="200" cy="200" r="85" fill="#0e1015" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Vault 3-Arc Mechanical Latches -->
  <path d="M 200 125 A 75 75 0 0 1 265 237" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 245 255 A 75 75 0 0 1 155 255" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 135 237 A 75 75 0 0 1 200 125" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Structural Spokes -->
  <line x1="200" y1="130" x2="200" y2="175" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="250" y1="230" x2="215" y2="210" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="230" x2="185" y2="210" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Heavy Mechanical Locking Pins -->
  <rect x="195" y="105" width="10" height="16" rx="2" fill="#15181e" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="270" y="215" width="16" height="10" rx="2" fill="#15181e" stroke="#ffffff" stroke-width="1.5" transform="rotate(30 278 220)"/>
  <rect x="114" y="215" width="16" height="10" rx="2" fill="#15181e" stroke="#ffffff" stroke-width="1.5" transform="rotate(-30 122 220)"/>

  <!-- Central Gold Vault Escrow Wheel & Hub -->
  <circle cx="200" cy="200" r="32" fill="#15181e" stroke="#ffc439" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="16" fill="#ffc439"/>
  <circle cx="200" cy="200" r="6" fill="#090a0c"/>

  <!-- Wheel Hand Grips -->
  <line x1="200" y1="162" x2="200" y2="152" stroke="#ffc439" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="238" x2="200" y2="248" stroke="#ffc439" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="162" y1="200" x2="152" y2="200" stroke="#ffc439" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="238" y1="200" x2="248" y2="200" stroke="#ffc439" stroke-width="2.5" stroke-linecap="round"/>
</svg>

