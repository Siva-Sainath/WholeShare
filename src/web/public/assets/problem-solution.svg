<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
  <!-- Left Side: Fragmented Retail Sourcing -->
  <rect x="20" y="20" width="280" height="200" rx="12" fill="#0e1015" stroke="#1c2029" stroke-width="1.5"/>
  <text x="40" y="52" font-family="'Geist', sans-serif" font-weight="600" font-size="13" letter-spacing="1.5" fill="#ef4444">SOLO SME PURCHASING</text>
  <text x="40" y="74" font-family="'Geist', sans-serif" font-weight="400" font-size="12" fill="#7e8799">Below supplier MOQ threshold</text>

  <!-- Solo Buyer Node -->
  <circle cx="60" cy="120" r="14" stroke="#7e8799" stroke-width="1.5" fill="#15181e"/>
  <path d="M 85 120 L 145 120" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="96" y="112" font-family="'Geist Mono', monospace" font-size="10" fill="#ef4444">BLOCKED</text>

  <!-- Retail Penalty Node -->
  <rect x="155" y="98" width="125" height="44" rx="6" fill="#15181e" stroke="#1c2029" stroke-width="1.5"/>
  <text x="170" y="118" font-family="'Geist', sans-serif" font-weight="500" font-size="12" fill="#ffffff">Retail Pricing</text>
  <text x="170" y="132" font-family="'Geist Mono', monospace" font-size="11" fill="#ef4444">+35% to +60% Markup</text>

  <!-- Right Side: WholeShare Escrow Pooling -->
  <rect x="340" y="20" width="280" height="200" rx="12" fill="#0e1015" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <text x="360" y="52" font-family="'Geist', sans-serif" font-weight="600" font-size="13" letter-spacing="1.5" fill="#ffc439">WHOLESHARE POOLING</text>
  <text x="360" y="74" font-family="'Geist', sans-serif" font-weight="400" font-size="12" fill="#7e8799">Aggregated demand escrow</text>

  <!-- 3 Pooled Nodes -->
  <circle cx="375" cy="100" r="10" stroke="#cbd5e1" stroke-width="1.5" fill="#15181e"/>
  <circle cx="375" cy="124" r="10" stroke="#cbd5e1" stroke-width="1.5" fill="#15181e"/>
  <circle cx="375" cy="148" r="10" stroke="#cbd5e1" stroke-width="1.5" fill="#15181e"/>

  <path d="M 390 100 C 415 100, 425 124, 445 124" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 390 124 L 445 124" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 390 148 C 415 148, 425 124, 445 124" stroke="#10b981" stroke-width="1.5"/>

  <!-- Tier-1 Escrow Target -->
  <rect x="455" y="98" width="145" height="44" rx="6" fill="#15181e" stroke="#10b981" stroke-width="1.5"/>
  <text x="470" y="118" font-family="'Geist', sans-serif" font-weight="500" font-size="12" fill="#ffffff">Tier-1 Volume</text>
  <text x="470" y="132" font-family="'Geist Mono', monospace" font-size="11" fill="#10b981">Up to 35% Savings</text>
</svg>

