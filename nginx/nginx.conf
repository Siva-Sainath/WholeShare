events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=agent_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream wholeshare_node {
        server app:3000;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 1M;

        # Agent Chat Endpoint with Strict Rate Limit and Generous Timeout
        location /api/v1/agent/chat {
            limit_req zone=agent_limit burst=2 nodelay;
            proxy_pass http://wholeshare_node;
            proxy_read_timeout 90s;
            proxy_connect_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Server-Sent Events Endpoint: Disable Proxy Buffering
        location /api/v1/events {
            proxy_pass http://wholeshare_node;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_read_timeout 24h;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Default API and Static Assets
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://wholeshare_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
